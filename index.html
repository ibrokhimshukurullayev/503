<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>503</title>
  </head>
  <body>
    <header class="bg-light-gray">
      <div class="container flex items-center py-1.5">
        <select
          id="lang-select"
          class="cursor-pointer rounded-md border-none bg-transparent px-2 py-1 text-display-3"
        >
          <option value="ru">Русский</option>
          <option value="uz">O'zbekcha</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <main class="bg-white">
      <div class="flex justify-center flex-col items-center mt-18 mb-36">
        <a href="#" class="flex flex-col items-center leading-none">
          <img src="/src/assets/images/logo.svg" alt="logo" />
        </a>
        <img
          src="/src/assets/images/503.webp"
          alt="503"
          class="max-w-lg w-full mt-18 mb-22.5"
        />
        <div class="text-center">
          <h1 class="text-display-1" data-i18n="heading">
            Sayt qayta tiklanmoqda
          </h1>
          <p class="text-title-1 mt-4 text-dark-gray" data-i18n="sub">
            Сайт на реконструкции
          </p>
        </div>
      </div>
    </main>

    <footer class="bg-medium-gray">
      <div
        class="mx-auto max-w-250 grid items-center justify-between gap-20 md:grid-cols-[auto_auto_auto]"
      >
        <div class="flex flex-col items-center self-center mt-10 md:items-end">
          <div class="text-center md:text-right">
            <h2 class="text-title-1 leading-snug" data-i18n="footer_h1">
              Возьми Bazar с собой!
            </h2>
            <p class="text-title-1 leading-snug" data-i18n="footer_h2">
              Удобное приложение для быстрого доступа ко всем товарам
            </p>
          </div>
          <div
            class="mt-6 flex flex-wrap items-center justify-center gap-3 md:justify-end"
          >
            <a href="#">
              <img
                src="/src/assets/images/google-play-logo.svg"
                alt="Google Play"
              />
            </a>
            <a href="#">
              <img
                src="/src/assets/images/app-store-logo.svg"
                alt="App Store"
              />
            </a>
          </div>
        </div>

        <div class="-mt-14">
          <img
            class="w-60 h-95 object-contain"
            src="/src/assets/images/phone.webp"
            alt="OpenBazar catalog"
          />
        </div>

        <div class="mt-10">
          <img
            src="/src/assets/images/QR.png"
            alt="QR code"
            class="h-36 w-36"
          />
        </div>
      </div>

      <div
        class="container flex flex-col items-center justify-center gap-17.5 pt-18 pb-18 sm:flex-row"
      >
        <div class="flex items-center gap-8">
          <img src="/src/assets/images/logo.svg" alt="logo" />
          <p class="text-body2 text-dark-gray">
            © 2022—2024 SmartBazar.<br />Все права защищены.
          </p>
        </div>
        <div class="flex items-center gap-12">
          <div
            class="flex flex-col items-center gap-4 text-sm sm:flex-row sm:gap-8"
          >
            <div class="flex items-end gap-2 text-center sm:text-left">
              <img src="/src/assets/images/Phone.svg" class="w-5 h-5" alt="" />
              <div class="flex flex-col items-center gap-1 sm:items-start">
                <p
                  class="text-caption-1 text-dark-gray"
                  data-i18n="short_number"
                >
                  Короткий номер
                </p>
                <a
                  href="tel:1377"
                  class="flex items-center gap-1.5 text-headline-1 text-ob-dark"
                >
                  1377
                </a>
              </div>
            </div>
            <div class="flex items-end gap-2 text-center sm:text-left">
              <img src="/src/assets/images/Phone.svg" class="w-5 h-5" alt="" />
              <div class="flex flex-col items-center gap-1 sm:items-start">
                <p
                  class="text-caption-1 text-dark-gray"
                  data-i18n="head_office"
                >
                  Головной офис
                </p>
                <a
                  href="tel:+78777771377"
                  class="flex items-center gap-1.5 text-headline-1 text-ob-dark"
                >
                  78 777-13-77
                </a>
              </div>
            </div>
            <div class="flex items-end gap-2 text-center sm:text-left">
              <img
                src="/src/assets/images/email.svg"
                class="w-5 h-5"
                alt="email"
              />
              <div class="flex flex-col items-center gap-1 sm:items-start">
                <p
                  class="text-caption-1 text-dark-gray"
                  data-i18n="email_label"
                >
                  Электронная почта
                </p>
                <a
                  href="mailto:office@smartbank.uz"
                  class="flex items-center gap-1.5 font-bold text-ob-dark"
                >
                  office@smartbank.uz
                </a>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-5">
            <a href="#" aria-label="telegram">
              <img
                class="w-5 h-5"
                src="/src/assets/images/telegram.svg"
                alt="telegram"
              />
            </a>
            <a href="#" aria-label="facebook">
              <img
                class="w-5 h-5"
                src="/src/assets/images/facebook.svg"
                alt="facebook"
              />
            </a>
            <a href="#" aria-label="instagram">
              <img
                class="w-5 h-5"
                src="/src/assets/images/instagram.svg"
                alt="instagram"
              />
            </a>
          </div>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
