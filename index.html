<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>503</title>
  </head>
  <body>
    <header class="bg-surface">
      <div class="mx-auto flex max-w-7xl items-center px-6 py-[6px]">
        <select
          id="lang-select"
          class="cursor-pointer rounded-md border-none bg-transparent px-2 py-1 text-sm font-medium text-ob-dark focus:outline-none focus:ring-2 focus:ring-ob-blue"
        >
          <option value="ru">Русский</option>
          <option value="uz">O'zbekcha</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <main class="bg-white">
      <div class="flex justify-center flex-col items-center pt-18 pb-36">
        <a href="#" class="flex flex-col items-center leading-none">
          <img src="/src/assets/images/logo.svg" alt="logo" />
        </a>
        <img
          src="/src/assets/images/503.webp"
          alt="503"
          class="max-w-lg w-full pt-18 pb-22.5"
        />
        <div class="text-center">
          <h1 class="text-display-1 text-ob-dark" data-i18n="heading">
            Sayt qayta tiklanmoqda
          </h1>
          <p
            class="text-title-1 pt-4 text-xl font-semibold text-[#ABABAB]"
            data-i18n="sub"
          >
            Сайт на реконструкции
          </p>
        </div>
      </div>
    </main>

    <footer class="bg-footer-surface">
      <div
        class="mx-auto max-w-[1000px] grid items-center justify-between gap-20 md:grid-cols-[auto_auto_auto]"
      >
        <div class="flex flex-col items-center self-center pt-10 md:items-end">
          <div class="text-center md:text-right">
            <h2 class="text-title-1 leading-snug" data-i18n="footer_h1">
              Возьми Bazar с собой!
            </h2>
            <p class="text-title-1 leading-snug" data-i18n="footer_h2">
              Удобное приложение для быстрого доступа ко всем товарам
            </p>
          </div>
          <div
            class="mt-6 flex flex-wrap items-center justify-center gap-3 md:justify-end"
          >
            <a href="#">
              <img
                src="/src/assets/images/play-market-logo.png"
                alt="Google Play"
              />
            </a>
            <a href="#">
              <img
                src="/src/assets/images/app-store-logo.png"
                alt="App Store"
              />
            </a>
          </div>
        </div>

        <div class="-mt-14">
          <img
            class="w-[240px] h-[380px] object-contain"
            src="/src/assets/images/phone.webp "
            alt="OpenBazar catalog"
          />
        </div>

        <div class="pt-10">
          <img
            src="/src/assets/images/QR.png"
            alt="QR code"
            class="h-36 w-36"
          />
        </div>
      </div>

      <div
        class="mx-auto flex max-w-7xl flex-col items-center justify-center gap-17.5 py-18 sm:flex-row"
      >
        <div class="flex items-center gap-8">
          <img src="/src/assets/images/logo.svg" alt="logo" />
          <p
            class="text-body-2 leading-relaxed text-footer-text"
            data-i18n-html="copyright"
          >
            © 2022—2024 SmartBazar.<br />Все права защищены.
          </p>
        </div>
        <div class="flex items-center gap-12">
          <div
            class="flex flex-col items-center gap-4 text-sm sm:flex-row sm:gap-8"
          >
            <div class="flex items-end gap-2 text-center sm:text-left">
              <img src="/src/assets/images/Phone.svg" alt="" />
              <div class="flex flex-col items-center gap-1 sm:items-start">
                <p
                  class="text-caption-1 text-footer-text"
                  data-i18n="short_number"
                >
                  Короткий номер
                </p>
                <a
                  href="tel:1377"
                  class="flex items-center gap-1.5 text-headline-1 text-ob-dark"
                >
                  1377
                </a>
              </div>
            </div>
            <div class="flex items-end gap-2 text-center sm:text-left">
              <img src="/src/assets/images/Phone.svg" alt="" />
              <div class="flex flex-col items-center gap-1 sm:items-start">
                <p
                  class="text-caption-1 text-[#ABABAB]"
                  data-i18n="head_office"
                >
                  Головной офис
                </p>
                <a
                  href="tel:+78777771377"
                  class="flex items-center gap-1.5 text-headline-1 text-ob-dark"
                >
                  78 777-13-77
                </a>
              </div>
            </div>
            <div class="flex items-end gap-2 text-center sm:text-left">
              <img src="/src/assets/images/email.svg" alt="email" />
              <div class="flex flex-col items-center gap-1 sm:items-start">
                <p
                  class="text-caption-1 text-footer-text"
                  data-i18n="email_label"
                >
                  Электронная почта
                </p>
                <a
                  href="mailto:office@smartbank.uz"
                  class="flex items-center gap-1.5 font-bold text-ob-dark"
                >
                  office@smartbank.uz
                </a>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-5">
            <a href="#" aria-label="telegram">
              <img src="/src/assets/images/telegram.svg" alt="telegram" />
            </a>
            <a href="#" aria-label="facebook">
              <img src="/src/assets/images/facebook.svg" alt="facebook" />
            </a>
            <a href="#" aria-label="instagram">
              <img src="/src/assets/images/instagram.svg" alt="instagram" />
            </a>
          </div>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
