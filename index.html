<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>503</title>
  </head>
  <body>
    <header class="border-gray-100 bg-[#F9F9F9]">
      <div class="mx-auto flex max-w-7xl items-center py-[6px]">
        <select
          id="lang-select"
          class="rounded-md border border-gray-200 bg-white px-1 py-1 text-sm font-medium text-ob-dark focus:outline-none focus:ring-2 focus:ring-ob-blue"
        >
          <option value="ru">Русский</option>
          <option value="uz">O'zbekcha</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>
    <main class="bg-white">
      <div class="flex justify-center py-18">
        <a href="#" class="flex flex-col items-center leading-none">
          <img src="/src/assets/images/logo.svg" alt="logo" />
        </a>
      </div>
      <div class="pb-20 flex justify-center">
        <img src="/src/assets/images/503.png" alt="503" />
      </div>
      <div class="mt-6 pb-24 text-center">
        <h1 class="display-1-42-bold text-ob-dark" data-i18n="heading">
          Sayt qayta tiklanmoqda
        </h1>
        <p
          class="mt-4 text-lg font-bold text-[#ABABAB] sm:text-xl"
          data-i18n="sub"
        >
          Сайт на реконструкции
        </p>
      </div>
    </main>
    <footer class="bg-[#F9F9F9]">
      <div
        class="mx-auto grid max-w-7xl items-center gap-12 px-6 pb-16 md:grid-cols-2"
      >
        <div class="order-2 md:order-1 md:pl-10">
          <div class="text-right md:text-right">
            <h2
              class="text-2xl font-extrabold leading-snug sm:text-3xl"
              data-i18n="footer_h1"
            >
              Возьми Bazar с собой!
            </h2>
            <p
              class="text-2xl font-extrabold leading-snug sm:text-3xl"
              data-i18n="footer_h2"
            >
              Удобное приложение для быстрого доступа ко всем товарам
            </p>
          </div>

          <div class="mt-8 flex flex-wrap items-center justify-end gap-4">
            <a href="#" class="flex items-center gap-3 rounded-xl">
              <img
                src="/src/assets/images/play-market-logo.png"
                alt="google play"
              />
            </a>
            <a href="#" class="flex items-center gap-3 rounded-xl">
              <img
                src="/src/assets/images/app-store-logo.png"
                alt="app store"
              />
            </a>
          </div>
        </div>

        <div class="order-1 flex items-center justify-center gap-6 md:order-2">
          <div class="relative -mt-8 flex items-start">
            <img
              src="/src/assets/images/phone-dizayn1.png"
              alt="OpenBazar app screen"
              class="w-40 sm:w-48"
            />
            <img
              src="/src/assets/images/phonedizayn2.png"
              alt="OpenBazar app catalog screen"
              class="relative z-10 -ml-10 mt-12 w-40 sm:w-48"
            />
          </div>
          <div class="ml-6 rounded-xl bg-white p-3 shadow-md">
            <img src="/src/assets/images/QR.png" alt="qr" class="h-32 w-32" />
          </div>
        </div>
      </div>

      <div>
        <div
          class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-6 px-6 py-8 sm:flex-row"
        >
          <div class="flex items-center gap-8 sm:items-start">
            <img src="/src/assets/images/logo.svg" alt="logo" />
            <p class="text-xs text-[#ABABAB]" data-i18n-html="copyright">
              © 2022—2024 SmartBazar.<br />Все права защищены.
            </p>
          </div>

          <div
            class="flex flex-col items-center gap-4 text-sm sm:flex-row sm:gap-10"
          >
            <div class="text-center sm:text-left">
              <p class="text-[#ABABAB]" data-i18n="short_number">
                Короткий номер
              </p>
              <a
                href="tel:1377"
                class="flex items-center gap-2 font-bold text-ob-dark"
              >
                <img
                  src="/src/assets/images/Phone.png"
                  alt=""
                  class="h-4 w-4"
                />
                1377</a
              >
            </div>
            <div class="text-center sm:text-left">
              <p class="text-[#ABABAB]" data-i18n="head_office">
                Головной офис
              </p>
              <a
                href="tel:+78777771377"
                class="flex items-center gap-2 font-bold text-ob-dark"
              >
                <img
                  src="/src/assets/images/Phone.png"
                  alt=""
                  class="h-4 w-4"
                />
                78 777-13-77</a
              >
            </div>
            <div class="text-center sm:text-left">
              <p class="text-[#ABABAB]" data-i18n="email_label">
                Электронная почта
              </p>
              <a
                href="mailto:office@smartbank.uz"
                class="flex items-center gap-2 font-bold text-ob-dark"
              >
                <img src="/src/assets/images/sms.png" alt="" class="h-4 w-4" />
                office@smartbank.uz</a
              >
            </div>
          </div>

          <div class="flex items-center gap-7">
            <a href="#" aria-label="telegram">
              <img
                src="/src/assets/images/telegram.svg"
                alt="telegram"
                class="h-4 w-4"
              />
            </a>
            <a href="#" aria-label="facebook">
              <img
                src="/src/assets/images/facebook.svg"
                alt="facebook"
                class="h-4 w-4"
              />
            </a>
            <a href="#" aria-label="instagram">
              <img
                src="/src/assets/images/instagram.svg"
                alt="instagram"
                class="h-4 w-4"
              />
            </a>
          </div>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
